name: CI

on:
  push:
  pull_request:
    branches:
      - initial-build
  schedule:
    - cron: '0 7 * * 1' # weekly
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          FORK_TS_CHECKER_MEMORY_LIMIT: "8192"
          GENERATE_SOURCEMAP: "false"
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: digital-nutritionist-backend/pyproject.toml

      - name: Install dependencies
        working-directory: digital-nutritionist-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        working-directory: digital-nutritionist-backend
        run: python -m pytest

