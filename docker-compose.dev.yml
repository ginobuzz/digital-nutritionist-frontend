version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nutritionist
      POSTGRES_PASSWORD: nutritionist
      POSTGRES_DB: digital_nutritionist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./digital-nutritionist-backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://nutritionist:nutritionist@db:5432/digital_nutritionist
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REACT_APP_API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
